name: Build dist

# The installers for lattice-diamond-mcp, built the way cortex-bridge's workflow builds its own: started by hand,
# one zip per operating system, each tested on a clean machine, then combined. Two kinds:
#
#   EMBEDDED    lattice-diamond-mcp-<version>-embedded-<os>-x86_64.zip   (the customer package; input `combined-embedded`)
#               A bundled Python with the locked packages unpacked into it, and no executable of ours:
#                 Windows: python.org's own embeddable Python 3.12.10, signed by the Python Software Foundation,
#                          started as `python.exe -I -m diamond_mcp`;
#                 Linux:   python-build-standalone's CPython 3.12.10 (the interpreter uv uses), trimmed, started as
#                          `bin/python3.12 -I -m diamond_mcp`; glibc 2.17+ (Red Hat 7).
#               Needs no Python on the machine. Built by scripts/build_embedded.py through scripts/create_export.py,
#               which only download and unpack files; each half is built on its own system so that it can be
#               install-tested there.
#
#   WHEELS      lattice-diamond-mcp-<version>-cp<NN>-<os>-x86_64.zip
#               The package and every dependency as wheels, installed with pip into a virtual
#               environment. No program of ours is installed: the server runs as `python -I -m diamond_mcp` from
#               that environment. Tied to ONE Python version (the `wheels_python` input) and needs glibc 2.28+ on
#               Linux (Red Hat 8). Built on the operating system it is for: pip resolves for the machine it runs on.
#
# The per-OS zips are then COMBINED, once for each kind, into the packages to hand out:
#
#   lattice-diamond-mcp-<version>-embedded-windows-linux-x86_64.zip      (artifact lattice-diamond-mcp-combined-embedded)
#   lattice-diamond-mcp-<version>-wheels-windows-linux-<cpNN>.zip        (artifact lattice-diamond-mcp-combined-wheels)
#
# A combined zip has one install.py and one folder per build; install.py picks the folder for the machine
# it runs on and checks its MANIFEST.sha256. scripts/combine_installers.py builds it without changing anything
# inside a build, and refuses to run unless both operating systems are present, from the same commit. A combined
# zip is only made once every per-OS zip of its kind has built and installed on a fresh runner, and is itself
# installed on fresh Linux and Windows runners before the workflow succeeds. The per-OS artifacts stay
# available as intermediates.
#
# Everything that matters is in scripts/create_export.py, scripts/build_embedded.py and scripts/build_installer.py,
# so a build can be reproduced on a laptop with the same commands the workflow runs
# (`python scripts/create_export.py --both` builds the embedded package). The builds test-install their own zip
# where they can; the verify jobs then install each zip on a FRESH runner.
#
# Every third-party action is pinned to a commit, not a tag: a tag can be moved to different code
# after it has been reviewed. The comment after each pin names the version it was taken from. Nothing
# updates the pins automatically; README.md ("Updating pinned actions and dependencies") says how.
#
# Status: the shell steps of every job were executed on a Linux host and the file validates against
# GitHub's workflow schema. The workflow itself has never run on GitHub, and the Windows legs have
# never run anywhere. The first run is the first test of both.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to build'
        required: true
        default: 'main'
      installers:
        description: 'Which installers to build (combined-embedded = the Windows and Linux embedded-Python package; both = combined-embedded and wheels)'
        required: false
        type: choice
        options: [both, combined-embedded, wheels]
        default: both
      wheels_python:
        description: 'Python version of the wheels zips (3.11 is the minimum), or `all`'
        required: false
        type: choice
        options: ['3.11', '3.12', '3.13', all]
        default: '3.11'

permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------------------ embedded (Windows)

  build-embedded:
    name: Build embedded package (windows-x86_64)
    if: ${{ inputs.installers != 'wheels' }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Python to run the build script
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the build tool
        run: python -m pip install build

      # gpg checks the interpreter's OpenPGP signature; Git for Windows provides it in this bash shell.
      - name: Show gpg
        run: gpg --version | head -n 1

      # Fails, and writes nothing, if the downloaded interpreter differs from the pinned SHA-256 or its OpenPGP
      # signature does not verify against the pinned key, python.exe
      # does not carry the Python Software Foundation's signature, a package differs from uv.lock, the
      # folder holds a program other than python.exe, or the package does not install and start.
      # scripts/create_export.py is the entry point (the same command a person runs locally); it runs
      # build_embedded.py, installs the finished zip with its own install.py and starts the installed server.
      - name: Build the embedded package
        run: python scripts/create_export.py --windows --outdir out

      - name: Upload the embedded package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-diamond-mcp-embedded-windows-x86_64
          path: |
            out/lattice-diamond-mcp-*.zip
            out/lattice-diamond-mcp-*.zip.sha256
            out/lattice-diamond-mcp-*.zip.sbom.cdx.json
            out/lattice-diamond-mcp-*.zip.buildinfo
          if-no-files-found: error

  # Installs the package on a fresh Windows runner with an old installer Python (3.8, the oldest
  # install.py supports), starts the installed server over MCP, and uninstalls.
  verify-embedded:
    needs: build-embedded
    name: Verify embedded package (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Download the embedded package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lattice-diamond-mcp-embedded-windows-x86_64
          path: out

      - name: Check the checksum
        run: cd out && sha256sum -c ./*.zip.sha256

      - name: Unpack
        run: |
          mkdir unpacked
          unzip -q out/lattice-diamond-mcp-*.zip -d unpacked
          bundle=$(echo "$PWD"/unpacked/*/)
          bundle=${bundle%/}   # without the trailing slash, find prints paths that the -path pattern below can never match
          test -f "$bundle/install.py" && test -f "$bundle/python/python.exe"
          # the only program in the package is python.exe
          others=$(find "$bundle" -iname '*.exe' ! -path "$bundle/python/python.exe" | head -n 1)
          if [ -n "$others" ]; then echo "unexpected program: $others" >&2; exit 1; fi

      - name: Set up the installer's Python
        id: installer
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8'

      - name: Set up Python for the protocol check
        id: checker
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          native() { cygpath -m "$1"; }
          bundle=$(echo "$PWD"/unpacked/*/)
          install_dir=$(native "$RUNNER_TEMP/diamond-mcp-python")
          '${{ steps.installer.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --no-register --install-dir "$install_dir" | tee install.log
          echo "INSTALL_DIR=$install_dir" >> "$GITHUB_ENV"

      # Windows checks the signature of what it runs: python.exe must verify as signed by the Python Software
      # Foundation. This is the first place the signature is validated rather than only looked for.
      - name: Windows reports python.exe as validly signed
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:INSTALL_DIR\python.exe"
          $sig | Format-List Status, StatusMessage, @{n='Signer';e={$_.SignerCertificate.Subject}}
          if ($sig.Status -ne 'Valid') { throw "python.exe signature status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw "unexpected signer" }

      # mcp imports pywin32 unconditionally on Windows, and pywin32 is found through its .pth file, which the embedded
      # Python reads only because the ._pth file enables `import site`. The package keeps only the pywin32 files that
      # import needs and leaves out pyjwt, cryptography and cffi; this imports the real thing to prove both choices.
      - name: The Windows-only dependencies load
        run: |
          "$INSTALL_DIR/python.exe" -I -c "import sys, pywintypes, win32api, win32job, win32con; import mcp.os.win32.utilities, diamond_mcp.server; left_out = {'jwt', 'cryptography', 'cffi', 'pycparser'}; bad = sorted(m for m in sys.modules if m.split('.')[0] in left_out); assert not bad, 'the server imports packages that the package leaves out: %s' % bad; print('pywin32 and the server import under', sys.version.split()[0], '; none of the left-out packages is imported')"

      - name: Talk MCP to the installed server
        run: |
          '${{ steps.checker.outputs.python-path }}' scripts/smoke_test.py "$INSTALL_DIR/python.exe" --args="-I -m diamond_mcp"

      - name: Uninstall
        run: |
          native() { cygpath -m "$1"; }
          bundle=$(echo "$PWD"/unpacked/*/)
          '${{ steps.installer.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --uninstall --install-dir "$INSTALL_DIR"
          if [ -e "$INSTALL_DIR" ]; then echo "$INSTALL_DIR is still there" >&2; exit 1; fi

  # ---------------------------------------------------------------- combined-embedded (Windows + Linux)
  #
  # A bundled Python (python.org's, signed, for Windows; python-build-standalone's for Linux) with the locked packages
  # unpacked into it, for each system, and the two combined into one zip. No executable of ours on either system.
  # The Windows half is built by build-embedded and verify-embedded above; these jobs add the Linux half and the combination.

  build-linux-embedded:
    name: Build embedded package (linux-x86_64)
    if: ${{ inputs.installers != 'wheels' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Python to run the build script
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the build tool
        run: python -m pip install build

      # Fails, and writes nothing, if the downloaded interpreter differs from the pinned SHA-256, a package differs from uv.lock,
      # a file needs a glibc newer than 2.17, the folder holds a program other than bin/python3.12 or a symbolic link, the
      # notices belong to another interpreter release, or the package does not install and start.
      - name: Build the Linux embedded package
        run: python scripts/create_export.py --linux --outdir out

      - name: Upload the Linux embedded package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-diamond-mcp-embedded-linux-x86_64
          path: |
            out/lattice-diamond-mcp-*.zip
            out/lattice-diamond-mcp-*.zip.sha256
            out/lattice-diamond-mcp-*.zip.sbom.cdx.json
            out/lattice-diamond-mcp-*.zip.buildinfo
          if-no-files-found: error

  # Installs the Linux package on fresh runners of two Ubuntu releases with old and new installer Pythons, starts the installed
  # server over MCP, and uninstalls.
  verify-linux-embedded:
    needs: build-linux-embedded
    name: Verify Linux embedded package (${{ matrix.os }}, installer on Python ${{ matrix.installer_python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            installer_python: '3.8'
          - os: ubuntu-24.04
            installer_python: '3.13'
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Download the Linux embedded package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lattice-diamond-mcp-embedded-linux-x86_64
          path: out

      - name: Check the checksum
        run: cd out && sha256sum -c ./*.zip.sha256

      - name: Unpack
        run: |
          mkdir unpacked
          unzip -q out/lattice-diamond-mcp-*.zip -d unpacked
          bundle=$(echo "$PWD"/unpacked/*/)
          bundle=${bundle%/}
          test -f "$bundle/install.py" && test -x "$bundle/python/bin/python3.12"
          # the only program in the package is bin/python3.12, and there are no symbolic links
          others=$(find "$bundle/python/bin" -type f ! -name python3.12 | head -n 1)
          if [ -n "$others" ]; then echo "unexpected program: $others" >&2; exit 1; fi
          links=$(find "$bundle" -type l | head -n 1)
          if [ -n "$links" ]; then echo "unexpected symbolic link: $links" >&2; exit 1; fi

      - name: Set up the installer's Python
        id: installer
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.installer_python }}

      - name: Set up Python for the protocol check
        id: checker
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          bundle=$(echo "$PWD"/unpacked/*/)
          install_dir="$RUNNER_TEMP/diamond-mcp-python"
          '${{ steps.installer.outputs.python-path }}' "${bundle%/}/install.py" --no-register --install-dir "$install_dir" | tee install.log
          grep -q "Integrity: all" install.log
          echo "INSTALL_DIR=$install_dir" >> "$GITHUB_ENV"

      # The server must not need the packages the build leaves out (pyjwt, cryptography, cffi, pycparser).
      - name: The server imports and none of the left-out packages is loaded
        run: |
          "$INSTALL_DIR/bin/python3.12" -I -c "import sys, diamond_mcp.server; left_out = {'jwt', 'cryptography', 'cffi', 'pycparser'}; bad = sorted(m for m in sys.modules if m.split('.')[0] in left_out); assert not bad, 'the server imports packages that the package leaves out: %s' % bad; print('the server imports under', sys.version.split()[0], '; none of the left-out packages is imported')"

      - name: Talk MCP to the installed server
        run: |
          '${{ steps.checker.outputs.python-path }}' scripts/smoke_test.py "$INSTALL_DIR/bin/python3.12" --args="-I -m diamond_mcp"

      - name: Uninstall
        run: |
          bundle=$(echo "$PWD"/unpacked/*/)
          '${{ steps.installer.outputs.python-path }}' "${bundle%/}/install.py" --uninstall --install-dir "$INSTALL_DIR"
          if [ -e "$INSTALL_DIR" ]; then echo "$INSTALL_DIR is still there" >&2; exit 1; fi

  # The combined-embedded package: the Windows and Linux embedded packages in one zip, one install.py.
  combine-embedded:
    needs: [build-embedded, verify-embedded, build-linux-embedded, verify-linux-embedded]
    if: ${{ !cancelled() && needs.build-embedded.result == 'success' && needs.verify-embedded.result == 'success' && needs.build-linux-embedded.result == 'success' && needs.verify-linux-embedded.result == 'success' }}
    name: Combine the embedded packages (Windows + Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download the Windows embedded package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lattice-diamond-mcp-embedded-windows-x86_64
          path: parts

      - name: Download the Linux embedded package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lattice-diamond-mcp-embedded-linux-x86_64
          path: parts

      - name: Check the checksums
        run: |
          ls -la parts
          cd parts && sha256sum -c ./*.zip.sha256

      # create_export.py combines the two zips (it refuses unless they come from one commit and one version), installs the result
      # on this Linux runner, and writes the SBOM and the internal .buildinfo beside the zip.
      - name: Combine
        run: |
          python scripts/create_export.py --both --outdir out \
            --windows-zip parts/lattice-diamond-mcp-*-embedded-windows-x86_64.zip \
            --linux-zip parts/lattice-diamond-mcp-*-embedded-linux-x86_64.zip
          ls -la out

      - name: Upload the combined-embedded package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-diamond-mcp-combined-embedded
          path: |
            out/lattice-diamond-mcp-*.zip
            out/lattice-diamond-mcp-*.zip.sha256
            out/lattice-diamond-mcp-*.zip.sbom.cdx.json
            out/lattice-diamond-mcp-*.zip.buildinfo
          if-no-files-found: error

  # Installs the combined package on a fresh runner of each system the way a customer would: install.py must choose the right
  # folder, and the installed server must speak MCP.
  verify-combined-embedded:
    needs: combine-embedded
    name: Verify combined-embedded (${{ matrix.os }}, installer on Python ${{ matrix.installer_python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            installer_python: '3.8'
          - os: ubuntu-24.04
            installer_python: '3.13'
          - os: windows-2022
            installer_python: '3.8'
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Download the combined-embedded package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lattice-diamond-mcp-combined-embedded
          path: out

      - name: Check the checksum
        run: cd out && sha256sum -c ./*.zip.sha256

      - name: Unpack
        run: |
          mkdir unpacked
          unzip -q out/lattice-diamond-mcp-*.zip -d unpacked
          bundle=$(echo "$PWD"/unpacked/*/)
          bundle=${bundle%/}
          test -f "$bundle/install.py" && test -f "$bundle/windows-x86_64/python/python.exe" && test -f "$bundle/linux-x86_64/python/bin/python3.12"

      - name: Set up the installer's Python
        id: installer
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.installer_python }}

      - name: Set up Python for the protocol check
        id: checker
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install with the installer's Python
        run: |
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          bundle=$(echo "$PWD"/unpacked/*/)
          install_dir=$(native "$RUNNER_TEMP/diamond-mcp-embedded")
          '${{ steps.installer.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --no-register --install-dir "$install_dir" | tee install.log
          grep -q "several builds; using the one for ${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x86_64" install.log
          grep -q "Integrity: all" install.log
          echo "INSTALL_DIR=$install_dir" >> "$GITHUB_ENV"

      - name: Talk MCP to the installed server
        run: |
          if [ -f "$INSTALL_DIR/python.exe" ]; then program="$INSTALL_DIR/python.exe"; else program="$INSTALL_DIR/bin/python3.12"; fi
          '${{ steps.checker.outputs.python-path }}' scripts/smoke_test.py "$program" --args="-I -m diamond_mcp"

      - name: Uninstall
        run: |
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          bundle=$(echo "$PWD"/unpacked/*/)
          '${{ steps.installer.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --uninstall --install-dir "$INSTALL_DIR"
          if [ -e "$INSTALL_DIR" ]; then echo "$INSTALL_DIR is still there" >&2; exit 1; fi

  # ---------------------------------------------------------------------------------- wheels

  # Turns the `wheels_python` choice into the list the two wheels jobs build and verify.
  plan:
    name: Plan the wheels builds
    if: ${{ inputs.installers != 'combined-embedded' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      pythons: ${{ steps.pick.outputs.pythons }}
    steps:
      - name: Pick the Python versions
        id: pick
        env:
          CHOICE: ${{ inputs.wheels_python || '3.11' }}
        run: |
          if [ "$CHOICE" = all ]; then
            echo 'pythons=["3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          else
            echo "pythons=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # One zip per (OS, Python), each built on that OS under that Python: the zip contains the
  # dependency wheels for exactly that pair, which pip downloads for the machine it runs on.
  build-wheels:
    needs: plan
    name: Build wheels (${{ matrix.name }}, Python ${{ matrix.python }})
    if: ${{ inputs.installers != 'combined-embedded' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      # The Python the zip is FOR: build_installer.py records it and the installer will look for it.
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the build front end
        run: python -m pip install "build==1.6.1"

      - name: Show the toolchain
        run: |
          python --version
          python -m pip --version
          python -m build --version
          git --version

      # Builds the wheel, downloads every dependency wheel for this Python and OS at the versions in
      # uv.lock, checks each against the SHA-256 recorded there, writes requirements.txt (hashes) and
      # the licence texts, then installs the bundle into a throwaway environment with its own
      # install.py (pip --require-hashes). Fails, and writes nothing, if any of that fails.
      - name: Build the wheels installer
        run: python scripts/build_installer.py --outdir out

      - name: List the output
        run: ls -la out

      - name: Upload the wheels installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-diamond-mcp-wheels-${{ matrix.name }}-py${{ matrix.python }}
          path: |
            out/lattice-diamond-mcp-*.zip
            out/lattice-diamond-mcp-*.zip.sha256
          if-no-files-found: error

  # Installs each wheels zip on a fresh runner under the Python it is for, then talks MCP to the
  # installed server. install.py is run by that same Python; the wheels zip needs the matching one.
  # It still runs when one leg's build failed, so a first-time failure on one system does not hide the other.
  verify-wheels:
    needs: [plan, build-wheels]
    name: Verify wheels (${{ matrix.name }}, Python ${{ matrix.python }})
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-wheels.result != 'skipped' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Download the installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lattice-diamond-mcp-wheels-${{ matrix.name }}-py${{ matrix.python }}
          path: out

      - name: Check the checksum
        run: cd out && sha256sum -c ./*.zip.sha256

      - name: Unpack
        run: |
          mkdir unpacked
          unzip -q out/lattice-diamond-mcp-*.zip -d unpacked
          ls unpacked/*/

      - name: Set up Python ${{ matrix.python }}
        id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          bundle=$(echo "$PWD"/unpacked/*/)
          venv_dir=$(native "$RUNNER_TEMP/diamond-mcp-venv")
          '${{ steps.py.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --no-register --venv-dir "$venv_dir"
          echo "VENV_DIR=$venv_dir" >> "$GITHUB_ENV"

      - name: Talk MCP to the installed server
        run: |
          # No program of ours is installed: the server is the environment's python running the module.
          py="$VENV_DIR/bin/python"
          if [ -f "$VENV_DIR/Scripts/python.exe" ]; then py="$VENV_DIR/Scripts/python.exe"; fi
          if ls "$VENV_DIR"/bin/diamond-mcp "$VENV_DIR"/Scripts/diamond-mcp.exe >/dev/null 2>&1; then
            echo "a diamond-mcp launcher was installed; the wheels install must not create one" >&2; exit 1
          fi
          '${{ steps.py.outputs.python-path }}' scripts/smoke_test.py "$py" --args="-I -m diamond_mcp"

      - name: Uninstall
        run: |
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          bundle=$(echo "$PWD"/unpacked/*/)
          '${{ steps.py.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --uninstall --venv-dir "$VENV_DIR"
          if [ -e "$VENV_DIR" ]; then echo "$VENV_DIR is still there" >&2; exit 1; fi

  # Joins the Windows and Linux wheels zips (every Python version that was built) into one package.
  combine-wheels:
    needs: [build-wheels, verify-wheels]
    if: ${{ !cancelled() && needs.build-wheels.result == 'success' && needs.verify-wheels.result == 'success' }}
    name: Combine the wheels zips (Windows + Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download the Windows and Linux zips
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lattice-diamond-mcp-wheels-*
          merge-multiple: true
          path: parts

      - name: Check the checksums
        run: |
          ls -la parts
          cd parts && sha256sum -c ./*.zip.sha256

      - name: Combine
        run: |
          python scripts/combine_installers.py --kind wheels --outdir out parts/lattice-diamond-mcp-*.zip
          ls -la out

      - name: Upload the combined wheels package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lattice-diamond-mcp-combined-wheels
          path: |
            out/lattice-diamond-mcp-*.zip
            out/lattice-diamond-mcp-*.zip.sha256
          if-no-files-found: error

  # Installs the combined zip on a fresh runner of each operating system under each Python version it
  # holds: install.py must pick the folder for that system and that Python, then the server must speak MCP.
  verify-combined-wheels:
    needs: [plan, combine-wheels]
    name: Verify combined wheels (${{ matrix.name }}, Python ${{ matrix.python }})
    if: ${{ !cancelled() && needs.combine-wheels.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REF }}

      - name: Download the combined package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lattice-diamond-mcp-combined-wheels
          path: out

      - name: Check the checksum
        run: cd out && sha256sum -c ./*.zip.sha256

      - name: Unpack
        run: |
          mkdir unpacked
          unzip -q out/lattice-diamond-mcp-*.zip -d unpacked
          ls unpacked/*/
          bundle=$(echo "$PWD"/unpacked/*/)
          test -f "$bundle/install.py" && test -d "$bundle/windows-x86_64-cp$(echo '${{ matrix.python }}' | tr -d .)" && test -d "$bundle/linux-x86_64-cp$(echo '${{ matrix.python }}' | tr -d .)"

      - name: Set up Python ${{ matrix.python }}
        id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          bundle=$(echo "$PWD"/unpacked/*/)
          venv_dir=$(native "$RUNNER_TEMP/diamond-mcp-venv")
          '${{ steps.py.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --no-register --venv-dir "$venv_dir" | tee install.log
          grep -q "using the one for ${{ matrix.name }}, Python ${{ matrix.python }}" install.log
          echo "VENV_DIR=$venv_dir" >> "$GITHUB_ENV"

      - name: Talk MCP to the installed server
        run: |
          # No program of ours is installed: the server is the environment's python running the module.
          py="$VENV_DIR/bin/python"
          if [ -f "$VENV_DIR/Scripts/python.exe" ]; then py="$VENV_DIR/Scripts/python.exe"; fi
          if ls "$VENV_DIR"/bin/diamond-mcp "$VENV_DIR"/Scripts/diamond-mcp.exe >/dev/null 2>&1; then
            echo "a diamond-mcp launcher was installed; the wheels install must not create one" >&2; exit 1
          fi
          '${{ steps.py.outputs.python-path }}' scripts/smoke_test.py "$py" --args="-I -m diamond_mcp"

      - name: Uninstall
        run: |
          native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else echo "$1"; fi; }
          bundle=$(echo "$PWD"/unpacked/*/)
          '${{ steps.py.outputs.python-path }}' "$(native "${bundle%/}")/install.py" --uninstall --venv-dir "$VENV_DIR"
          if [ -e "$VENV_DIR" ]; then echo "$VENV_DIR is still there" >&2; exit 1; fi
