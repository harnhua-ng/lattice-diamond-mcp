name: Security scan

# Runs the unit tests and every scan in security_scan/ (Bandit, a secrets scan, an OSV advisory check
# of uv.lock, seeded fuzzing of the parsers, and dynamic probes of the running server). The same
# command works on a laptop: python security_scan/run_scans.py. The results are uploaded as an artifact.
#
# Third-party actions are pinned to a commit; the comment after each pin names the version. Dependabot
# (.github/dependabot.yml) proposes updates.
#
# Status: the commands in the steps were run on a Linux host. The workflow itself has never run on GitHub.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # weekly, so a new advisory against a locked package shows up without a code change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Tests and security scans
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only runs uv. The Python that runs the tests and the scans is the 3.11 uv fetches below.
      - name: Set up Python to install uv
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the pinned uv
        run: |
          uv_version=$(python -c "import pathlib, re; print(re.search(r'^UV_VERSION = \"([0-9.]+)\"', pathlib.Path('scripts/build_binary.py').read_text(), re.M).group(1))")
          echo "uv ${uv_version}"
          python -m pip install "uv==${uv_version}"

      # The Tcl quoting check and most unit tests run a real tclsh.
      - name: Install tclsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tcl

      # --frozen: the exact, hash-checked packages in uv.lock, and a failure if the lock is out of date.
      - name: Unit tests
        run: python -m uv run --frozen --python 3.11 --extra test python -m pytest -q

      - name: Security scans
        run: python -m uv run --frozen --no-dev --python 3.11 --with bandit==1.9.4 python security_scan/run_scans.py --out security_scan/out

      - name: Upload the scan results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-results
          path: security_scan/out/
          if-no-files-found: warn
