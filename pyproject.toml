[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-diamond-mcp"
version = "0.1.0"
description = "MCP server for Lattice Diamond FPGA design software"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["mcp", "diamond", "fpga", "lattice", "ai"]
dependencies = [
    "mcp>=1.29.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dist = ["build"]

[dependency-groups]
# Used only to build the standalone executable (scripts/build_binary.py). Kept in a group so
# uv.lock records PyInstaller and its dependencies with hashes; it is not a runtime dependency.
build = ["pyinstaller==6.22.3"]

[project.scripts]
diamond-mcp = "diamond_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["diamond_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real Lattice Diamond installation and a licence (set DIAMOND_TEST_LDF)",
]
